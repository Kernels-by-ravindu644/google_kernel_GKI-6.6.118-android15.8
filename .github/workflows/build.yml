name: Build and Release Kernel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y bc bison flex libssl-dev libelf-dev pahole

      - name: Set release tag
        run: echo "RELEASE_TAG=$(date +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # build.sh clones the submodules itself (full history, KernelSU-Next derives its
      # version from the commit count), fetches clang-r510928 and writes dist/Pixel-10-Pro-*.zip
      - name: Build kernel
        run: ./build.sh

      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          name: Kernel Release ${{ env.RELEASE_TAG }}
          artifacts: dist/Pixel-10-Pro-*.zip
          allowUpdates: true
          body: |
            NetHunter kernel for the Pixel 10 Pro (blazer), built from ${{ github.sha }}.

            The zip carries `boot.img` and the `nethunter-wifi-drivers-*.zip` KernelSU module.
            1. `fastboot flash boot boot.img`
            2. Install the module zip from the KernelSU-Next manager and reboot. It loads rtl8821au and mt76x0u (with the MT7610U firmware) at boot and shows the loaded/failed count in its description.

            KernelSU-Next manager: https://github.com/KernelSU-Next/KernelSU-Next/releases/latest
