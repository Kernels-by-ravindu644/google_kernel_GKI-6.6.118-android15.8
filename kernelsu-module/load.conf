# Kernel modules to load at boot, one per line, in dependency order.
# Paths are relative to this module's modules/ directory. '#' starts a comment.
# build.sh reads this list to decide which .ko files to ship.

# Realtek RTL8811AU/RTL8821AU (Alfa AWUS036ACS etc.) -- needs only the stock cfg80211
8821au.ko

# MediaTek MT7610U (0e8d:7610) -- mt76 stack on top of the stock mac80211/cfg80211
mt76.ko
mt76-usb.ko
mt76x02-lib.ko
mt76x02-usb.ko
mt76x0-common.ko
mt76x0u.ko
